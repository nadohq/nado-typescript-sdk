name: Package Age Guard

on:
  pull_request:

jobs:
  package-age-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Configure Bun package age check
        id: bun-config
        run: |
          MAX_AGE_SECONDS=$(( ${MAX_PACKAGE_AGE_DAYS:-14} * 24 * 60 * 60 ))
          
          # Parse allowlist into bunfig.toml format
          if [ -n "$PACKAGE_AGE_ALLOWLIST" ]; then
            # Convert comma/newline separated list to TOML array format
            # Split by comma or newline, trim whitespace, filter empty, format as TOML array
            ALLOWLIST_ARRAY=$(echo "$PACKAGE_AGE_ALLOWLIST" | \
              tr ',' '\n' | \
              sed 's/^[[:space:]]*//;s/[[:space:]]*$//' | \
              grep -v '^$' | \
              sed 's/^/"/;s/$/"/' | \
              tr '\n' ',' | \
              sed 's/,$//' | \
              sed 's/^/[/;s/$/]/')
            
            # Create bunfig.toml with minimum release age and exclusions
            cat > bunfig.toml << EOF
          [install]
          minimumReleaseAge = $MAX_AGE_SECONDS
          minimumReleaseAgeExcludes = $ALLOWLIST_ARRAY
          EOF
            echo "Created bunfig.toml with minimumReleaseAge = $MAX_AGE_SECONDS seconds ($MAX_PACKAGE_AGE_DAYS days)"
            echo "Allowlist: $ALLOWLIST_ARRAY"
          else
            # Create bunfig.toml with minimum release age only
            cat > bunfig.toml << EOF
          [install]
          minimumReleaseAge = $MAX_AGE_SECONDS
          EOF
            echo "Created bunfig.toml with minimumReleaseAge = $MAX_AGE_SECONDS seconds ($MAX_PACKAGE_AGE_DAYS days)"
          fi
        env:
          MAX_PACKAGE_AGE_DAYS: ${{ vars.MAX_PACKAGE_AGE_DAYS || '14' }}
          PACKAGE_AGE_ALLOWLIST: ${{ vars.PACKAGE_AGE_ALLOWLIST }}

      - name: Run Bun package age check
        id: age-check
        run: |
          # Run bun install with age check enabled (via bunfig.toml)
          # Bun will check package ages during install and fail if packages are too new
          # Capture both stdout and stderr to parse violations
          set +e
          OUTPUT=$(bun install 2>&1)
          EXIT_CODE=$?
          set -e
          
          # Check if Bun detected package age violations
          # Bun's error messages typically mention "minimum release age", "too new", "recently published", etc.
          if [ $EXIT_CODE -ne 0 ] && echo "$OUTPUT" | grep -qiE "minimum.*release.*age|too.*new|recently.*published|package.*age|does not meet.*age"; then
            echo "has_violations=true" >> $GITHUB_OUTPUT
            echo "bun_output<<EOF" >> $GITHUB_OUTPUT
            echo "$OUTPUT" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          else
            echo "has_violations=false" >> $GITHUB_OUTPUT
            if [ $EXIT_CODE -eq 0 ]; then
              echo "Package age check passed. All dependencies meet the minimum release age requirement."
            else
              echo "Bun install failed, but not due to package age restrictions."
            fi
          fi
        continue-on-error: true

      - name: Parse violations and generate report
        id: parse-report
        if: always() && steps.age-check.outputs.has_violations == 'true'
        uses: actions/github-script@v7
        env:
          BUN_OUTPUT: ${{ steps.age-check.outputs.bun_output }}
          MAX_PACKAGE_AGE_DAYS: ${{ vars.MAX_PACKAGE_AGE_DAYS || '14' }}
          REGISTRY_URL: ${{ vars.NPM_REGISTRY_URL || 'https://registry.npmjs.org' }}
        with:
          script: |
            const output = process.env.BUN_OUTPUT || '';
            const MAX_AGE_DAYS = Number(process.env.MAX_PACKAGE_AGE_DAYS || '14');
            const REGISTRY_URL = (process.env.REGISTRY_URL || 'https://registry.npmjs.org').replace(/\/$/, '');
            
            // Extract package names and versions from Bun's error output
            // Bun typically outputs something like: "error: Package 'package-name@version' was published X seconds ago"
            const packagePattern = /(['"]?)([^@\s'"]+)@([^\s'"]+)\1/g;
            const violations = [];
            const seen = new Set();
            
            let match;
            while ((match = packagePattern.exec(output)) !== null) {
              const [, , name, version] = match;
              const key = `${name}@${version}`;
              if (!seen.has(key)) {
                seen.add(key);
                violations.push({ name, version });
              }
            }
            
            // Fetch publish dates for detailed reporting
            async function fetchPublishDate(name, version) {
              const encoded = encodeURIComponent(name);
              const url = `${REGISTRY_URL}/${encoded}`;
              const controller = new AbortController();
              const timer = setTimeout(() => controller.abort(), 10000);
              try {
                const response = await fetch(url, { signal: controller.signal, headers: { accept: 'application/json' } });
                if (!response.ok) return null;
                const data = await response.json();
                if (!data.time || !data.time[version]) return null;
                return new Date(data.time[version]);
              } catch (error) {
                return null;
              } finally {
                clearTimeout(timer);
              }
            }
            
            const detailedViolations = [];
            for (const { name, version } of violations) {
              const publishedAt = await fetchPublishDate(name, version);
              if (publishedAt) {
                const ageDays = (Date.now() - publishedAt.getTime()) / (1000 * 60 * 60 * 24);
                detailedViolations.push({ name, version, ageDays, publishedAt: publishedAt.toISOString() });
              } else {
                detailedViolations.push({ name, version, ageDays: 0, publishedAt: null });
              }
            }
            
            if (detailedViolations.length > 0) {
              const lines = detailedViolations
                .map((v) => {
                  if (v.publishedAt) {
                    return `- ${v.name}@${v.version} published ${Number(v.ageDays).toFixed(2)} days ago on ${new Date(v.publishedAt).toISOString().slice(0, 10)}`;
                  }
                  return `- ${v.name}@${v.version}`;
                })
                .join('\n');
              const message = `Package age warning: packages should be at least ${MAX_AGE_DAYS} days old. Add to PACKAGE_AGE_ALLOWLIST to override when justified.\n\n${lines}`;
              
              core.setOutput('violations', JSON.stringify(detailedViolations));
              core.setOutput('message', message);
              core.setOutput('lines', lines);
            } else {
              // Fallback: use Bun's raw output if we couldn't parse packages
              core.setOutput('violations', '[]');
              core.setOutput('message', `Package age warning: Bun detected packages that don't meet the minimum release age requirement.\n\nBun output:\n\`\`\`\n${output}\n\`\`\``);
              core.setOutput('lines', '');
            }

      - name: Comment and label on package age warnings
        if: steps.age-check.outputs.has_violations == 'true'
        uses: actions/github-script@v7
        env:
          AGE_MESSAGE: ${{ steps.parse-report.outputs.message }}
          AGE_VIOLATIONS: ${{ steps.parse-report.outputs.violations }}
          AGE_LINES: ${{ steps.parse-report.outputs.lines }}
          BUN_OUTPUT: ${{ steps.age-check.outputs.bun_output }}
          MAX_PACKAGE_AGE_DAYS: ${{ vars.MAX_PACKAGE_AGE_DAYS }}
        with:
          script: |
            const marker = '<!-- package-age-guard -->';
            const lines = process.env.AGE_LINES || '';
            const message = process.env.AGE_MESSAGE || '';
            const bunOutput = process.env.BUN_OUTPUT || '';
            
            // Use parsed message if available, otherwise fall back to Bun's raw output
            const body = [
              marker,
              '⚠️ Package age warning',
              '',
              `Packages should be at least ${process.env.MAX_PACKAGE_AGE_DAYS || '14'} days old.`,
              '',
              lines || message || (bunOutput ? `Bun detected packages that don't meet the minimum release age requirement:\n\n\`\`\`\n${bunOutput}\n\`\`\`` : 'Package age check failed.')
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            });

            const existing = comments.find((c) => c.body && c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                comment_id: existing.id,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body,
              });
            }

            const label = 'package-age-warning';
            try {
              await github.rest.issues.addLabels({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                labels: [label],
              });
            } catch (error) {
              core.warning(`Could not add label ${label}: ${error.message}`);
            }

      - name: Clean up comment/label when no warnings
        if: steps.age-check.outputs.has_violations == 'false'
        uses: actions/github-script@v7
        env:
          MARKER: '<!-- package-age-guard -->'
        with:
          script: |
            const marker = process.env.MARKER;
            const { data: comments } = await github.rest.issues.listComments({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            });

            const existing = comments.find((c) => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.deleteComment({
                comment_id: existing.id,
                owner: context.repo.owner,
                repo: context.repo.repo,
              });
            }

            const label = 'package-age-warning';
            try {
              await github.rest.issues.removeLabel({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: label,
              });
            } catch (error) {
              core.warning(`Label ${label} was not removed (may not exist): ${error.message}`);
            }
